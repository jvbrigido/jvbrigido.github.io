{# Ícones de traço, desenhados para o portal (sem marcas de terceiros). Herdam a cor do texto. #}
{% macro icone(nome) %}
<svg class="icone" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
{% if nome == 'dor' %}<path d="M2 12h4l2.2-5 3.6 10 2.4-5H22"/>
{% elif nome == 'sono' %}<path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6z"/>
{% elif nome == 'atencao' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>
{% elif nome == 'raiva' %}<path d="M13 2 4.5 13.5H11L10 22l9-12.5h-6.5z"/>
{% elif nome == 'ansiedade' %}<path d="M2 9.5c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-2.3 5-1.5"/><path d="M2 15.5c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-2.3 5-1.5"/>
{% elif nome == 'criancas' %}<circle cx="8" cy="7.5" r="3"/><path d="M2.5 20c0-3.3 2.5-6 5.5-6s5.5 2.7 5.5 6"/><circle cx="17" cy="10.5" r="2.2"/><path d="M14.2 20c.4-2.5 1.5-4.2 2.8-4.2s2.4 1.7 2.8 4.2"/>
{% elif nome == 'conversa' %}<path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-4.6a8.5 8.5 0 1 1 15.9-4.4z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" stroke-width="2.4"/>
{% elif nome == 'relogio' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>
{% elif nome == 'calendario' %}<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>
{% elif nome == 'local' %}<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
{% elif nome == 'valor' %}<rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19M6.5 15h4"/>
{% elif nome == 'recibo' %}<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>
{% elif nome == 'video' %}<rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.5v9l-5.5-3"/>
{% endif %}
</svg>
{% endmacro %}
