# Como funciona a consulta (pedido do João em 20/10/2026, inspirado no site de referência).
# Dados confirmados pelo João em 20/10/2026, 15h08: 50 minutos; valor informado pelo WhatsApp; recibo para
# reembolso; atendimento on-line (ponto forte); atende crianças. Não falar em retorno (pedido dele).
# Os passos e os textos em primeira pessoa só vão ao site público com "aprovado: true" (aprovados pelo João em 21/10/2026).
consulta:
  aprovado: true
  passos:
    - titulo: "Agendamento"
      texto: "Pelo WhatsApp administrativo, você escolhe um horário disponível, no consultório ou on-line. Não é preciso enviar exames nem dados clínicos nesse primeiro contato."
    - titulo: "A consulta"
      texto: "A conversa começa pela sua história: o que trouxe você à consulta, desde quando, o que já foi tentado e como estão o sono, o humor e a rotina. Depois vêm o exame, as hipóteses e as opções de cuidado."
    - titulo: "Depois da consulta"
      texto: "O próximo passo é combinado com você: exames, um tratamento ou o encaminhamento a outro profissional, sempre com a explicação do porquê."
  duracao: "50 minutos"
  valores: "Informados pelo WhatsApp"   # o João prefere informar o valor pelo WhatsApp (não publicar no site)
  reembolso: "Recibo para pedir reembolso ao plano de saúde"
  online: "Também on-line, por vídeo"
  criancas: "Sim, sempre acompanhados de um responsável."

como_trabalho:
  aprovado: true   # aprovado pelo João em 21/10/2026
  itens:
    - titulo: "A história vem antes do rótulo"
      texto: "Um diagnóstico depende de contexto, de tempo e de conversa. Às vezes, ele precisa de mais de um encontro."
    - titulo: "Corpo, sono e emoções na mesma avaliação"
      texto: "Muitas vezes, a dor mais incapacitante não aparece em nenhum exame. Por isso, dor, sono e humor entram juntos na conversa."
    - titulo: "Plano combinado com você"
      texto: "Cada decisão é explicada: exames, psicoterapia, outros profissionais e, quando necessário, medicamentos. O plano também é seu."

# Página Sobre com o currículo (Doc "Currículo · João Brígido (base Lattes)", 00 - Base Compartilhada, v1.1 de 20/10/2026).
# Aprovada pelo João em 21/10/2026 ("Autorizado"), com o retrato e as duas fotos. Faltam o ano da defesa do mestrado e o Lattes atualizado.
# Regras do Guia Mestre (cap. Sobre): primeira pessoa na apresentação; dados acadêmicos em formulação objetiva;
# formação em andamento descrita como tal; nada de "referência", "excelência" ou credencial estimada.
sobre:
  aprovado: true
  apresentacao: "Sou João Brígido, médico especialista em Ortopedia e Traumatologia, com formação em cirurgia do pé e tornozelo e mestrado com pesquisa sobre a dor depois da cirurgia. Hoje curso o terceiro ano da residência médica em Psiquiatria, com término previsto para março de 2027. Este portal reúne conteúdos que preparo para tornar assuntos médicos mais compreensíveis e ajudar o leitor a formular perguntas melhores sobre a própria saúde."
  ensino: "Desde 2020, dou aulas em cursos preparatórios de ortopedia e para o Revalida; desde 2022, também de Medicina Preventiva, em cursos para provas de residência médica. Também escrevo manuais e apostilas para esses cursos, com a mesma preocupação que orienta este portal: transformar assunto difícil em explicação compreensível."
  formacao:
    - {titulo: "Graduação em Medicina", local: "Universidade Federal da Paraíba (UFPB)", periodo: "2011 a 2016"}
    - {titulo: "Residência médica em Ortopedia e Traumatologia", local: "Instituto Nacional de Traumatologia e Ortopedia (INTO)", periodo: "2017 a 2020"}
    - {titulo: "Título de Especialista em Ortopedia e Traumatologia", local: "Associação Médica Brasileira (AMB)", periodo: "2021 · RQE 34510"}
    - {titulo: "Fellowship em Cirurgia do Pé e Tornozelo", local: "INTO", periodo: "início em 2020"}
    - {titulo: "Mestrado em Ciências do Sistema Musculoesquelético", local: "INTO", periodo: "", nota: "Pesquisa: analgesia preventiva na cirurgia do pé e tornozelo, para reduzir a dor depois da operação.", confirmar: "ano da defesa (está no certificado)"}
    - {titulo: "Residência médica em Psiquiatria", local: "", periodo: "em andamento (3º ano), com término previsto para março de 2027"}
  sociedades:
    - "Membro titular da Sociedade Brasileira de Ortopedia e Traumatologia (SBOT), desde 2020"
    - "Membro do Comitê de Dor da SBOT, desde 2021"
    - "Membro da AO Trauma"
