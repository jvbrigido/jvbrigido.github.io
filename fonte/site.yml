# Ordem fixa e editorial: 1. Psiquiatria; 2. Dor; 3. Ortopedia e traumatologia (Guia Mestre, cap. 01).
eixos:
  - slug: psiquiatria
    numero: "01"
    nome: "Psiquiatria e saúde mental"
    curto: "psiquiatria"
    card: "Dúvidas sobre emoções, sono, atenção, sofrimento psíquico e cuidado em saúde mental, sem transformar informações gerais em diagnósticos individuais."
    intro: "Textos sobre emoções, humor, ansiedade, atenção, sono e cuidado em saúde mental. Eles explicam como uma avaliação funciona e quais perguntas ajudam a conversar com um profissional, sem transformar informações gerais em diagnósticos individuais. Se você não sabe por onde começar, o texto recomendado é uma boa porta de entrada."
  - slug: dor
    numero: "02"
    nome: "Dor"
    curto: "dor"
    card: "Conteúdos para compreender a experiência da dor, suas diferentes dimensões e as perguntas que ajudam a conversar sobre investigação e cuidado."
    intro: "Conteúdos para compreender a experiência da dor, especialmente quando ela persiste por meses. Os textos explicam como a dor é avaliada, como sono e humor se relacionam com ela e o que se sabe sobre as possibilidades e os limites do tratamento, sem reduzir a dor a uma única causa."
  - slug: ortopedia-traumatologia
    numero: "03"
    nome: "Ortopedia e traumatologia"
    curto: "ortopedia e traumatologia"
    card: "Explicações sobre problemas do movimento, lesões e recuperação, com atenção ao contexto de cada pessoa e aos limites de uma orientação on-line."
    intro: "Explicações sobre lesões, articulações e recuperação do movimento, com atenção ao pé e ao tornozelo. Os textos organizam as perguntas que ajudam a entender uma avaliação, o papel dos exames e as opções de cuidado, respeitando os limites de uma orientação on-line."

